<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khám Phá Phim - Thu Hà</title>
    <style>
        /* --- CSS GIAO DIỆN CHUẨN --- */
        
        body {
            background-color: #141414;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), rgba(20, 20, 20, 0.5));
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 200;
        }
        
        .back-btn {
            background: #e50914;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-btn:hover {
            background: #ff0a16;
            transform: scale(1.05);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            color: #e50914;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }
        
        .filter-section {
            display: flex;
            gap: 10px;
            margin: 0 0 30px 0;
            justify-content: center;
            flex-wrap: wrap;
            background: #222;
            padding: 20px;
            border-radius: 8px;
            position: sticky;
            top: 10px;
            z-index: 100;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }
        
        input,
        select,
        button {
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #333;
            color: white;
            outline: none;
        }
        
        button {
            background-color: #e50914;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        
        button:hover {
            background-color: #ff0a16;
            transform: scale(1.05);
        }
        /* Lưới hiển thị phim */
        
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
            min-height: 400px;
        }
        
        .movie-card {
            background: #1f1f1f;
            border-radius: 10px;
            overflow: hidden;
            transition: 0.3s;
            cursor: pointer;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }
        
        .movie-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 25px rgba(229, 9, 20, 0.3);
        }
        
        .movie-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        
        .movie-info {
            padding: 12px;
            flex-grow: 1;
        }
        
        .movie-info h3 {
            font-size: 15px;
            margin: 0 0 8px 0;
            color: #fff;
            /* Giới hạn 2 dòng tiêu đề */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 40px;
        }
        
        .movie-meta {
            font-size: 12px;
            color: #aaa;
        }
        
        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(229, 9, 20, 0.9);
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 3px;
            z-index: 1;
        }
        
        .pagination {
            text-align: center;
            margin-top: 50px;
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
            padding-bottom: 40px;
        }
        
        .pagination button:disabled {
            background: #444;
            color: #777;
            cursor: not-allowed;
            transform: none;
        }
        
        #page-info {
            font-weight: bold;
            color: #e50914;
        }
        
        .loading-spinner {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: #e50914;
        }

        /* ============================================ */
        /* CSS CHO MODAL POPUP - Hiển thị chi tiết phim */
        /* ============================================ */

        /* Container modal chính */
        .movie-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Overlay (nền tối phía sau modal) - click để đóng */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            cursor: pointer;
        }

        /* Nội dung modal (cái box trắng chứa info phim) */
        .modal-content {
            position: relative;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 2px solid #e50914;
            border-radius: 12px;
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(229, 9, 20, 0.3);
            animation: slideIn 0.3s ease-out;
        }

        /* Hiệu ứng modal xuất hiện (từ dưới lên) */
        @keyframes slideIn {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Nút X đóng modal (góc trên phải) */
        .modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 40px;
            height: 40px;
            padding: 0;
            border: none;
            background: #e50914;
            color: white;
            font-size: 28px;
            font-weight: bold;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.3s;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: #ff0a16;
            transform: scale(1.1);
        }

        /* Layout chính của modal: 2 cột (poster + info) */
        .modal-body {
            display: flex;
            gap: 30px;
            padding: 40px;
            align-items: flex-start;
        }

        /* Cột 1: Poster phim bên trái */
        .modal-poster {
            flex-shrink: 0;
        }

        .modal-poster img {
            width: 250px;
            height: 350px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            border: 2px solid #e50914;
        }

        /* Cột 2: Thông tin chi tiết phim bên phải */
        .modal-info {
            flex: 1;
            color: white;
        }

        /* Tiêu đề phim */
        .modal-title {
            font-size: 28px;
            font-weight: bold;
            color: #e50914;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Rating (sao) */
        .modal-rating {
            font-size: 18px;
            color: #ffc107;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* Mô tả/giới thiệu phim */
        .modal-description {
            font-size: 15px;
            line-height: 1.6;
            color: #ddd;
            margin-bottom: 25px;
            text-align: justify;
        }

        /* Chi tiết phim: các dòng thông tin (Năm, Thể loại, Đạo diễn, etc) */
        .modal-details {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #e50914;
        }

        /* Mỗi dòng chi tiết (Năm, Thể loại, v.v) */
        .detail-item {
            display: flex;
            gap: 15px;
            font-size: 14px;
        }

        .detail-label {
            color: #999;
            min-width: 80px;
            font-weight: bold;
        }

        .detail-value {
            color: #fff;
            flex: 1;
        }

        /* Nút "Xem Ngay" - nút chính để vào trang detail */
        .btn-watch-now {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #e50914, #ff0a16);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(229, 9, 20, 0.4);
        }

        .btn-watch-now:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(229, 9, 20, 0.6);
            background: linear-gradient(135deg, #ff0a16, #ff4444);
        }

        /* Responsive design cho mobile */
        @media (max-width: 768px) {
            .modal-body {
                flex-direction: column;
                padding: 20px;
                gap: 20px;
            }

            .modal-poster img {
                width: 150px;
                height: 220px;
            }

            .modal-title {
                font-size: 20px;
            }

            .modal-content {
                max-width: 95%;
            }
        }
    </style>
</head>

<body>

    <!-- Header với nút quay lại -->
    <header class="header">
        <a href="index.html" class="back-btn">← Quay lại trang chủ</a>
        <h2 style="margin: 0; color: #e50914; font-size: 18px;">FPT Play</h2>
    </header>

    <div class="container">
        <h1>KHÁM PHÁ PHIM</h1>

        <div class="filter-section">
            <input type="text" id="search-input" placeholder="Tìm tên phim...">

            <select id="filter-type">
                <option value="Tất cả">Tất cả loại</option>
                <option value="phim_le">Phim Lẻ</option>
                <option value="phim_bo">Phim Bộ</option>
                <option value="TV Show">TV Show</option>

            </select>

            <select id="filter-category">
                <option value="Tất cả">Tất cả thể loại</option>
                <option value="Hành động">Hành động</option>
                <option value="Gia đình">Gia đình</option>
                <option value="Khoa học viễn tưởng">Khoa học viễn tưởng</option>
                <option value="Hoạt hình">Hoạt hình</option>
                <option value="Tình cảm">Tình cảm</option>
                <option value="Âm nhạc">Âm nhạc</option>
                <option value="Giải trí">Giải trí</option>
                <option value="Hẹn hò">Hẹn hò</option>
            </select>

            <select id="year-filter">
                 <option value="">Tất cả năm</option>
                 <option value="2024">2024</option>
                 <option value="2023">2023</option>
                 <option value="2022">2022</option>
                 <option value="2021">2021</option>
                 <option value="2020">2020</option>
                 <option value="2019">2019</option>
    </select>

            <button id="search-btn">LỌC PHIM</button>
            <button id="clear-btn" style="background: #444;">XÓA HẾT</button>
        </div>

        <div id="movie-grid" class="movie-grid">
            <!-- Dữ liệu đổ vào đây -->
        </div>

        <div class="pagination">
            <button id="prev-btn">Trang trước</button>
            <span id="page-info">Trang 1 / 1</span>
            <button id="next-btn">Trang sau</button>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- MODAL POPUP - Hiển thị chi tiết phim khi click -->
    <!-- ============================================ -->
    <div id="movieModal" class="movie-modal" style="display: none;">
        <!-- Overlay (nền tối đằng sau modal) -->
        <div class="modal-overlay" onclick="closeMovieModal()"></div>
        
        <!-- Nội dung modal -->
        <div class="modal-content">
            <!-- Nút đóng (X) ở góc trên phải -->
            <button class="modal-close" onclick="closeMovieModal()">✕</button>
            
            <!-- Container chứa poster phim và thông tin -->
            <div class="modal-body">
                <!-- Cột 1: Poster phim bên trái -->
                <div class="modal-poster">
                    <img id="modalPoster" src="" alt="Poster" />
                </div>
                
                <!-- Cột 2: Thông tin chi tiết phim bên phải -->
                <div class="modal-info">
                    <!-- Tiêu đề phim -->
                    <h2 id="modalTitle" class="modal-title"></h2>
                    
                    <!-- Đánh giá sao -->
                    <div class="modal-rating">
                        <span id="modalStars">★★★★★</span>
                        <span id="modalScore"> (5/5)</span>
                    </div>
                    
                    <!-- Giới thiệu ngắn gọn -->
                    <p id="modalDescription" class="modal-description"></p>
                    
                    <!-- Chi tiết phim: Năm, Thể loại, v.v -->
                    <div class="modal-details">
                        <div class="detail-item">
                            <span class="detail-label">Năm:</span>
                            <span id="modalYear" class="detail-value"></span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Thể loại:</span>
                            <span id="modalCategory" class="detail-value"></span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Loại:</span>
                            <span id="modalType" class="detail-value"></span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Đạo diễn:</span>
                            <span id="modalDirector" class="detail-value">Chưa cập nhật</span>
                        </div>
                    </div>
                    
                    <!-- Nút "Xem Ngay" để vào trang detail -->
                    <button class="btn-watch-now" id="btnWatchNow" onclick="goToDetail()">
                        ▶ XEM NGAY
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- SCRIPT: XỬ LÝ LOGIC PHIM, MODAL, VÀ FAVORITE -->
    <!-- ============================================ -->
    <script>
        // URL API backend - backend chạy trên port 5000, KHÔNG phải 8000
        const API_URL = 'http://localhost:5000/api/movies';
        let currentPage = 1;
        const limit = 12;
        // Biến lưu thông tin phim hiện tại được click (để sử dụng khi bấm "Xem Ngay")
        let currentSelectedMovie = null;

        // ============================================
        // XỬ LÝ YÊU THÍCH (FAVORITES)
        // ============================================

        async function toggleFavorite(movieId, button) {
            const token = localStorage.getItem('token');
            if (!token) {
                if (typeof window.showToast === 'function') {
                    window.showToast('Vui lòng đăng nhập để thêm phim vào yêu thích', 'warning', 2500);
                } else {
                    alert('Vui lòng đăng nhập để thêm phim vào yêu thích');
                }
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                return;
            }

            if (!movieId) {
                console.error('Movie ID không hợp lệ:', movieId);
                if (typeof window.showToast === 'function') {
                    window.showToast('Lỗi: Không xác định được phim. Vui lòng thử lại.', 'error');
                }
                return;
            }

            try {
                const icon = button.querySelector('.heart-icon');
                const isFavorited = icon.textContent === '❤️';

                // Gọi API toggle favorite
                const response = await fetch(`http://localhost:5000/api/favorites/${movieId}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (response.ok && data.data && typeof data.data.isFavorite === 'boolean') {
                    if (data.data.isFavorite) {
                        icon.textContent = '❤️';
                        button.classList.add('favorited');
                        if (typeof window.showToast === 'function') {
                            window.showToast('Đã thêm vào danh sách yêu thích ❤️', 'success');
                        }
                    } else {
                        icon.textContent = '🤍';
                        button.classList.remove('favorited');
                        if (typeof window.showToast === 'function') {
                            window.showToast('Đã bỏ khỏi danh sách yêu thích', 'info');
                        }
                    }
                } else {
                    // Fallback: toggle dựa vào UI cũ
                    if (isFavorited) {
                        icon.textContent = '🤍';
                        button.classList.remove('favorited');
                    } else {
                        icon.textContent = '❤️';
                        button.classList.add('favorited');
                    }
                }
            } catch (error) {
                console.error('Lỗi khi toggle favorite:', error);
                if (typeof window.showToast === 'function') {
                    window.showToast('Không thể cập nhật yêu thích', 'error');
                }
            }
        }

        async function loadFavoriteStatus() {
            const token = localStorage.getItem('token');
            if (!token) return;

            try {
                const response = await fetch('http://localhost:5000/api/favorites', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    console.error('Lỗi khi load favorite status');
                    return;
                }

                const data = await response.json();
                if (!data || !data.data) {
                    console.log('Không có dữ liệu favorite');
                    return;
                }

                const favoriteMovies = data.data.data || data.data;
                if (!Array.isArray(favoriteMovies)) {
                    console.error('favoriteMovies không phải array');
                    return;
                }

                const favoriteIds = favoriteMovies.map(m => m._id || m.id);

                favoriteIds.forEach(movieId => {
                    const button = document.querySelector(`[data-movie-id="${movieId}"]`);
                    if (button) {
                        const icon = button.querySelector('.heart-icon');
                        icon.textContent = '❤️';
                        button.classList.add('favorited');
                    }
                });
            } catch (error) {
                console.error('Lỗi khi load favorite status:', error);
            }
        }

        function viewMovie(id) {
            window.location.href = `detail.html?id=${id}`;
        }

        // --- HÀM CHÍNH ĐỂ TẢI DỮ LIỆU ---
        async function loadMovies() {
            const searchInput = document.getElementById('search-input');
            const typeSelect = document.getElementById('filter-type');
            const categorySelect = document.getElementById('filter-category');

            const search = searchInput.value.trim();
            const type = typeSelect.value;
            const category = categorySelect.value;

            const params = {
                page: currentPage,
                limit: limit
            };

            // Chỉ gửi lên API nếu giá trị khác "Tất cả"
            if (search) params.search = search;
            if (type && type !== "Tất cả") params.type = type;
            if (category && category !== "Tất cả") params.category = category;

            const query = new URLSearchParams(params);

            try {
                const response = await fetch(`${API_URL}?${query.toString()}`);
                const result = await response.json();

                if (result.success) {
                    renderMovies(result.data);

                    // Cập nhật phân trang
                    const pg = result.pagination;
                    if (pg) {
                        updatePagination(pg.total, pg.currentPage, pg.totalPages);
                    }
                }
            } catch (error) {
                console.error("Lỗi kết nối Backend:", error);
                document.getElementById('movie-grid').innerHTML =
                    '<p style="text-align:center; width:100%">❌ Không thể kết nối với Server.</p>';
            }
        }

        // --- HIỂN THỊ PHIM ---
        function renderMovies(movies) {
            const grid = document.getElementById('movie-grid');
            if (!movies || movies.length === 0) {
                grid.innerHTML = '<p style="text-align:center; width:100%; color: #ccc; padding: 50px;">🔍 Không tìm thấy phim phù hợp.</p>';
                return;
            }

            grid.innerHTML = movies.map(movie => `
            <div class="movie-card">
                <span class="badge">${movie.type === 'phim_le' ? 'Phim Lẻ' : 'Phim Bộ'}</span>
                <img src="${movie.poster}" alt="${movie.title}" onerror="this.src='https://picsum.photos/seed/movie/300/450'" style="cursor: pointer;" onclick="viewMovie('${movie._id || movie.id}')">
                
                <!-- Icon yêu thích (góc trên bên phải) -->
                <button class="favorite-btn" 
                        data-movie-id="${movie._id || movie.id}"
                        title="Thêm vào yêu thích"
                        style="position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.5); border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; z-index: 10;">
                    <i class="heart-icon">🤍</i>
                </button>
                
                <div class="movie-info" style="cursor: pointer;" onclick="viewMovie('${movie._id || movie.id}')">
                    <h3>${movie.title}</h3>
                    <div class="movie-meta">
                        <span>📅 ${movie.year}</span> | 📂 ${movie.category}
                    </div>
                </div>
            </div>
        `).join('');

            // Attach event listeners cho nút yêu thích
            document.querySelectorAll('.favorite-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const movieId = this.getAttribute('data-movie-id');
                    toggleFavorite(movieId, this);
                });
            });

            // Load trạng thái yêu thích
            loadFavoriteStatus();
        }

        // --- CẬP NHẬT PHÂN TRANG ---
        function updatePagination(total, page, totalPages) {
            const pageInfo = document.getElementById('page-info');
            if (pageInfo) {
                pageInfo.innerText = `Trang ${page || 1} / ${totalPages || 1}`;
            }

            document.getElementById('prev-btn').disabled = (page <= 1);
            document.getElementById('next-btn').disabled = (page >= totalPages);
        }

        // --- SỰ KIỆN CÁC NÚT BẤM ---
        document.getElementById('search-btn').onclick = () => {
            currentPage = 1;
            loadMovies();
        };

        document.getElementById('clear-btn').onclick = () => {
            document.getElementById('search-input').value = "";
            document.getElementById('filter-type').value = "Tất cả";
            document.getElementById('filter-category').value = "Tất cả";
            currentPage = 1;

            // Xóa tham số trên URL để quay về trạng thái mặc định
            window.history.replaceState({}, document.title, window.location.pathname);
            loadMovies();
        };

        document.getElementById('prev-btn').onclick = () => {
            if (currentPage > 1) {
                currentPage--;
                loadMovies();
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            }
        };

        document.getElementById('next-btn').onclick = () => {
            currentPage++;
            loadMovies();
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        };

        // --- KHỞI TẠO KHI TRANG LOAD (QUAN TRỌNG) ---
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);

            // Đọc từ khóa tìm kiếm từ URL (ví dụ: ?search=Avengers)
            const searchKeyword = urlParams.get('search');
            if (searchKeyword) {
                // Điền từ khóa vào ô input để người dùng thấy đang tìm gì
                const searchInput = document.getElementById('search-input');
                if (searchInput) {
                    searchInput.value = decodeURIComponent(searchKeyword);
                }
            }

            // Đọc thể loại phim từ URL (ví dụ: ?category=Thiếu%20nhi)
            // Khi user click "Phim bộ", "Thiếu nhi", "Truyền hình" trên trang chủ,
            // index.js gọi filterByText() → chuyển sang movies.html?category=XXX
            // Ở đây đọc tham số đó, điền vào filter và tự động lọc phim
            const categoryFromUrl = urlParams.get('category');
            if (categoryFromUrl) {
                const decodedCategory = decodeURIComponent(categoryFromUrl);
                const categorySelect = document.getElementById('filter-category');
                if (categorySelect) {
                    // Thử gán vào select dropdown
                    categorySelect.value = decodedCategory;
                    // Nếu không tìm thấy option khớp (value vẫn là cũ), thêm option mới
                    if (categorySelect.value !== decodedCategory) {
                        const newOption = document.createElement('option');
                        newOption.value = decodedCategory;
                        newOption.textContent = decodedCategory;
                        categorySelect.appendChild(newOption);
                        categorySelect.value = decodedCategory;
                    }
                }

                // Cập nhật tiêu đề trang để khớp với thể loại đang xem
                const pageTitle = document.querySelector('h1');
                if (pageTitle) {
                    pageTitle.textContent = decodedCategory.toUpperCase();
                }
            }

            // Đọc type (định dạng) từ URL (ví dụ: ?type=TV Show)
            const typeFromUrl = urlParams.get('type');
            if (typeFromUrl) {
                const decodedType = decodeURIComponent(typeFromUrl);
                const typeSelect = document.getElementById('filter-type');
                if (typeSelect) {
                    // Thử gán vào select dropdown
                    typeSelect.value = decodedType;
                    // Nếu không tìm thấy option khớp, thêm option mới
                    if (typeSelect.value !== decodedType) {
                        const newOption = document.createElement('option');
                        newOption.value = decodedType;
                        newOption.textContent = decodedType;
                        typeSelect.appendChild(newOption);
                        typeSelect.value = decodedType;
                    }
                }

                // Cập nhật tiêu đề trang
                const pageTitle = document.querySelector('h1');
                if (pageTitle) {
                    pageTitle.textContent = decodedType.toUpperCase();
                }
            }

            // Gọi loadMovies() sau khi đã điền tất cả filter từ URL
            loadMovies();
        };

        // ============================================
        // HÀM XỬ LÝ MODAL POPUP - HIỂN THỊ CHI TIẾT PHIM
        // ============================================

        /**
         * Hàm mở modal và hiển thị thông tin chi tiết của phim được click
         * @param {Object} movie - Object chứa thông tin phim từ API
         */
        function openMovieModal(movie) {
            // Lưu thông tin phim hiện tại để dùng khi bấm "Xem Ngay"
            currentSelectedMovie = movie;

            // Điền dữ liệu vào các trường trong modal
            document.getElementById('modalPoster').src = movie.poster || 'https://picsum.photos/seed/movie/250/350';
            document.getElementById('modalTitle').textContent = movie.title || 'Không có tên';
            document.getElementById('modalDescription').textContent = movie.description || 'Chưa có mô tả';
            document.getElementById('modalYear').textContent = movie.year || 'Chưa cập nhật';
            document.getElementById('modalCategory').textContent = movie.category || 'Chưa cập nhật';
            
            // Hiển thị loại phim - Hỗ trợ tất cả loại từ Movie model
            function getMovieTypeDisplay(type) {
                const typeMap = {
                    // Format tiếng Việt (hiển thị trực tiếp)
                    'Phim lẻ': 'Phim lẻ',
                    'Phim bộ': 'Phim bộ', 
                    'TV Show': 'TV Show',
                    'Hoạt hình': 'Hoạt hình',
                    // Format cũ (convert sang hiển thị)
                    'phim_le': 'Phim lẻ',
                    'phim_bo': 'Phim bộ',
                    'phim_bo_viet': 'Phim bộ Việt',
                    'hoat_hinh': 'Hoạt hình',
                    'tv_show': 'TV Show'
                };
                return typeMap[type] || type || 'Chưa phân loại';
            }
            const movieType = getMovieTypeDisplay(movie.type);
            document.getElementById('modalType').textContent = movieType;

            // Lấy đánh giá từ dữ liệu phim
            // API trả về field avgRating (từ backend controller)
            const rating = movie.avgRating || movie.rating || movie.score || 5;
            // Chuyển rating thành số sao (mỗi điểm = 1 sao, tối đa 5 sao)
            const stars = '★'.repeat(Math.min(Math.round(rating), 5)) + '☆'.repeat(Math.max(5 - Math.round(rating), 0));
            document.getElementById('modalStars').textContent = stars;
            document.getElementById('modalScore').textContent = ` (${rating}/5)`;

            // Hiển thị modal (bỏ display: none)
            const modal = document.getElementById('movieModal');
            modal.style.display = 'flex';
        }

        /**
         * Hàm đóng modal khi click X hoặc click overlay
         */
        function closeMovieModal() {
            const modal = document.getElementById('movieModal');
            modal.style.display = 'none';
            // Xóa thông tin phim hiện tại
            currentSelectedMovie = null;
        }

        /**
         * Hàm chuyển hướng sang trang detail.html khi bấm "Xem Ngay"
         * Sử dụng currentSelectedMovie để lấy movie ID
         */
        function goToDetail() {
            if (currentSelectedMovie && currentSelectedMovie._id) {
                // Chuyển sang trang detail.html?id=...
                window.location.href = `detail.html?id=${currentSelectedMovie._id}`;
            } else {
                console.error('Không có thông tin phim để chuyển hướng');
                alert('Lỗi: Không thể xác định phim. Vui lòng thử lại.');
            }
        }

        /**
         * Hàm renderMovies được cập nhật để thêm event listener click
         * Khi click vào movie-card, sẽ mở modal hiển thị chi tiết
         */
        const originalRenderMovies = window.renderMovies;
        function renderMovies(movies) {
            const grid = document.getElementById('movie-grid');
            if (!movies || movies.length === 0) {
                grid.innerHTML = '<p style="text-align:center; width:100%; color: #ccc; padding: 50px;">Không tìm thấy phim phù hợp.</p>';
                return;
            }

            // Hiển thị danh sách phim
            grid.innerHTML = movies.map(movie => `
                <div class="movie-card" data-movie-id="${movie._id}">
                    <span class="badge">${movie.type === 'phim_le' ? 'Phim Lẻ' : 'Phim Bộ'}</span>
                    <img src="${movie.poster}" alt="${movie.title}" onerror="this.src='https://picsum.photos/seed/movie/300/450'" />
                    <div class="movie-info">
                        <h3 title="${movie.title}">${movie.title}</h3>
                        <div class="movie-meta">
                            <span>📅 ${movie.year} | 📂 ${movie.category}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            // Sau khi render xong, thêm event listener cho mỗi movie-card
            // Khi user click vào movie-card, sẽ mở modal
            const movieCards = document.querySelectorAll('.movie-card');
            movieCards.forEach(card => {
                card.addEventListener('click', function() {
                    // Lấy ID phim từ attribute data-movie-id
                    const movieId = this.getAttribute('data-movie-id');
                    // Tìm object phim tương ứng trong danh sách
                    const selectedMovie = movies.find(m => m._id === movieId);
                    if (selectedMovie) {
                        // Mở modal với thông tin phim
                        openMovieModal(selectedMovie);
                    }
                });
            });
        }

        // Ghi đè renderMovies để sử dụng phiên bản mới có modal
        window.renderMovies = renderMovies;
    </script>
