<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rồi Giải Trí - Xem Phim Online</title>
  
  <!-- ==================== CSS ==================== -->
  <!-- Import CSS cho trang chủ -->
  <link rel="stylesheet" href="../styles/index.css">
  <!-- Import Toast notification styles -->
  <link rel="stylesheet" href="../styles/toast.css">
</head>
<body>
  <!-- ==================== HEADER - TOPBAR ==================== -->
  <!-- Thanh header chứa logo, tìm kiếm và các icon -->
  <header class="topbar">
    <div class="topbar-left">
      <!-- Logo trang web (FPT Play style) -->
      <div class="logo">▶ FPT Play</div>
      
      <!-- Ô tìm kiếm phim -->
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Tìm phim..." />
        <button class="search-icon" id="searchBtn">🔍</button>
      </div>
    </div>
    
    <div class="topbar-right">
      <!-- Các icon tối ưu hoá (PL, SC, GC) -->
      <div class="icon-item">PL</div>
      <div class="icon-item">SC</div>
      <div class="icon-item">GC</div>
      <!-- Icon user - click để vào profile hoặc login -->
      <div class="icon-item" id="userIcon" style="cursor: pointer;">👤</div>
    </div>
  </header>

  <!-- ==================== MENU - NAVIGATION ==================== -->
  <!-- Menu điều hướng với các danh mục phim -->
  <nav class="menu">
    <div class="menu-links">
      <!-- Các link danh mục - click để filter phim -->
      <a href="#" onclick="event.preventDefault(); filterByText('Truyền hình')">Truyền hình</a>
      <a href="#" onclick="event.preventDefault(); filterByText('Phim bộ')">Phim bộ</a>
      <a href="#" onclick="event.preventDefault(); filterByText('TV show')">TV show</a>
      <a href="./kids.html">Thiếu nhi</a>
      <a href="./sports.html">Thể thao</a>
    </div>
    
    <div class="menu-actions">
      <!-- Nút "Phim chiếu rạp" - đến trang movies.html -->
      <a class="pill promo" href="movies.html">Phim chiếu rạp</a>
      <!-- Nút "Gói VIP" - đến trang subscription.html -->
      <a class="pill vip" href="subscription.html">Gói VIP</a>
    </div>
  </nav>

  <!-- ==================== MAIN CONTENT ==================== -->
  <main class="index-page">
    <!-- HERO SECTION - Phần featured phim nổi bật -->
    <section class="hero" id="heroSection">
      <!-- Ảnh nền phim nổi bật (được update bởi JavaScript từ API) -->
      <img src="" class="hero-bg" alt="Featured Movie" id="heroBg">
      
      <!-- Overlay gradient trên ảnh -->
      <div class="hero-overlay"></div>
      
      <!-- Nội dung text trên hero -->
      <div class="hero-content">
        <!-- Badge "Phim nổi bật" -->
        <div class="hero-badge">Phim nổi bật</div>
        
        <!-- Tiêu đề phim (được update bằng JS) -->
        <h1 class="hero-title" id="heroTitle">Tải phim...</h1>
        
        <!-- Mô tả phim (được update bằng JS) -->
        <p class="hero-desc" id="heroDesc">Đang tải thông tin phim...</p>
        
        <!-- Nút "Xem Ngay" - chuyển sang trang detail -->
        <a href="#" class="btn-play" id="playBtn">▶ Xem Ngay</a>
      </div>
      
      <!-- Thumbnails những phim khác ở bottom-right của hero -->
      <div class="hero-thumbs" id="heroThumbs"></div>
    </section>

    <!-- MOVIES SECTION - Danh sách phim phổ biến -->
    <section class="movies-section">
      <!-- Tiêu đề section -->
      <h2 class="section-title">Phim Phổ Biến</h2>
      
      <!-- Grid hiển thị danh sách phim (được fill bằng JS) -->
      <div class="movies-grid" id="moviesGrid">
        <!-- Default loading message -->
        <div class="loading">Đang tải phim...</div>
      </div>
    </section>
  </main>

  <!-- ============================================ -->
  <!-- MODAL POPUP - Hiển thị chi tiết phim khi click -->
  <!-- ============================================ -->
  <div id="movieModal" class="movie-modal" style="display: none;">
    <!-- Overlay (nền tối đằng sau modal) -->
    <div class="modal-overlay" onclick="closeMovieModal()"></div>
    
    <!-- Nội dung modal -->
    <div class="modal-content">
      <!-- Nút đóng (X) ở góc trên phải -->
      <button class="modal-close" onclick="closeMovieModal()">✕</button>
      
      <!-- Container chứa poster phim và thông tin -->
      <div class="modal-body">
        <!-- Cột 1: Poster phim bên trái -->
        <div class="modal-poster">
          <img id="modalPoster" src="" alt="Poster" />
        </div>
        
        <!-- Cột 2: Thông tin chi tiết phim bên phải -->
        <div class="modal-info">
          <!-- Tiêu đề phim -->
          <h2 id="modalTitle" class="modal-title"></h2>
          
          <!-- Đánh giá sao -->
          <div class="modal-rating">
            <span id="modalStars">★★★★★</span>
            <span id="modalScore"> (5/5)</span>
          </div>
          
          <!-- Giới thiệu ngắn gọn -->
          <p id="modalDescription" class="modal-description"></p>
          
          <!-- Chi tiết phim: Năm, Thể loại, v.v -->
          <div class="modal-details">
            <div class="detail-item">
              <span class="detail-label">Năm:</span>
              <span id="modalYear" class="detail-value"></span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Thể loại:</span>
              <span id="modalCategory" class="detail-value"></span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Loại:</span>
              <span id="modalType" class="detail-value"></span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Đạo diễn:</span>
              <span id="modalDirector" class="detail-value">Chưa cập nhật</span>
            </div>
          </div>
          
          <!-- Nút "Xem Ngay" để vào trang detail -->
          <button class="btn-watch-now" id="btnWatchNow" onclick="goToDetail()">
            ▶ XEM NGAY
          </button>
        </div>
      </div>
    </div>
  </div>
  <!-- Import API service trước (phải load trước index.js) -->
  <script src="../services/api.js"></script>
  <!-- Import Toast notification system -->
  <script src="../services/toast.js"></script>

  <!-- ============================================ -->
  <!-- SCRIPT: XỬ LÝ MODAL POPUP CHO TRANG CHỦ -->
  <!-- ============================================ -->
  <script>
    // Biến lưu thông tin phim hiện tại được click
    let currentSelectedMovie = null;

    /**
     * Hàm mở modal và hiển thị thông tin chi tiết của phim được click
     * @param {Object} movie - Object chứa thông tin phim từ API
     */
    function openMovieModal(movie) {
      // Lưu thông tin phim hiện tại để dùng khi bấm "Xem Ngay"
      currentSelectedMovie = movie;

      // Điền dữ liệu vào các trường trong modal
      document.getElementById('modalPoster').src = movie.thumbnail || 'https://picsum.photos/seed/movie/250/350';
      document.getElementById('modalTitle').textContent = movie.title || 'Không có tên';
      document.getElementById('modalDescription').textContent = movie.description || 'Chưa có mô tả';
      document.getElementById('modalYear').textContent = movie.year || 'Chưa cập nhật';
      document.getElementById('modalCategory').textContent = movie.category || 'Chưa cập nhật';
      
      // Hiển thị loại phim (Phim Lẻ hay Phim Bộ)
      const movieType = movie.type === 'phim_le' ? 'Phim Lẻ' : (movie.type === 'phim_bo' ? 'Phim Bộ' : 'Chưa xác định');
      document.getElementById('modalType').textContent = movieType;

      // Lấy đánh giá từ dữ liệu phim
      // API trả về field avgRating (từ backend controller)
      const rating = movie.avgRating || movie.rating || movie.score || 5;
      const stars = '★'.repeat(Math.min(Math.round(rating), 5)) + '☆'.repeat(Math.max(5 - Math.round(rating), 0));
      document.getElementById('modalStars').textContent = stars;
      document.getElementById('modalScore').textContent = ` (${rating}/5)`;

      // Hiển thị modal
      const modal = document.getElementById('movieModal');
      modal.style.display = 'flex';
    }

    /**
     * Hàm đóng modal khi click X hoặc click overlay
     */
    function closeMovieModal() {
      const modal = document.getElementById('movieModal');
      modal.style.display = 'none';
      currentSelectedMovie = null;
    }

    /**
     * Hàm chuyển hướng sang trang detail.html khi bấm "Xem Ngay"
     */
    function goToDetail() {
      if (currentSelectedMovie && currentSelectedMovie._id) {
        window.location.href = `detail.html?id=${currentSelectedMovie._id}`;
      } else {
        console.error('Không có thông tin phim để chuyển hướng');
        alert('Lỗi: Không thể xác định phim. Vui lòng thử lại.');
      }
    }
  </script>

  <!-- Import JavaScript cho trang chủ -->
  <script src="../modules/index.js" defer></script>
</body>
</html>
