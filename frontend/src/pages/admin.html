<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Quản lý Phim</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/admin.css">
</head>

<body>
    <nav class="card flex-between" style="border-radius: 0; padding: 15px 20px;">
        <h2 class="text-secondary" style="margin: 0;">🛠️ Admin Panel</h2>
        <a href="index.html" class="text-light">Quay lại Trang chủ</a>
    </nav>

    <main class="container mt-4 mb-5 fade-in">
        <div class="admin-tabs mb-4">
            <button class="tab-btn active" data-target="movieSection">🎬 Quản lý Phim</button>
            <button class="tab-btn" data-target="userSection">👥 Quản lý Người dùng</button>
        </div>

        <section id="movieSection" class="tab-content active">
            <div class="flex-between mb-3">
                <h2>Quản lý Kho Phim</h2>
                <button class="btn btn-primary" id="btnOpenAddModal">➕ Thêm Phim Mới</button>
            </div>
            <div class="card overflow-x-auto">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Hình ảnh</th>
                            <th>Tên phim</th>
                            <th>Thể loại</th>
                            <th>Định dạng</th>
                            <th>Lượt xem</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="movieTableBody"></tbody>
                </table>
            </div>
        </section>

        <section id="userSection" class="tab-content hidden">
            <div class="mb-3">
                <h2>Danh sách Thành viên</h2>
            </div>
            <div class="card overflow-x-auto">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Avatar</th>
                            <th>Họ tên</th>
                            <th>Email</th>
                            <th>Vai trò</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr>
                            <td colspan="6" class="text-center">Đang tải người dùng...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="movieModal" class="modal-overlay hidden">
        <div class="modal-content card slide-in-up">
            <div class="flex-between mb-3">
                <h3 id="modalTitle">Thêm Phim Mới</h3>
                <button class="btn btn-close" id="btnCloseModal">❌</button>
            </div>

            <form id="movieForm">
                <input type="hidden" id="movieId" value="">

                <div class="mb-2">
                    <label class="text-muted">Tên phim:</label>
                    <input type="text" id="movieTitle" style="width: 100%;" required>
                </div>

                <div class="mb-2">
                    <label class="text-muted">Mô tả:</label>
                    <textarea id="movieDesc" rows="3" style="width: 100%;" required></textarea>
                </div>

                <div class="row mb-2">
                    <div class="col">
                        <label class="text-muted">Thể loại:</label>
                        <select id="movieCategory" style="width: 100%;" required>
                            <option value="Hành động">Hành động</option>
                            <option value="Tình cảm">Tình cảm</option>
                            <option value="Kinh dị">Kinh dị</option>
                            <option value="Hoạt hình">Hoạt hình</option>
                        </select>
                    </div>
                    <div class="col">
                        <label class="text-muted">Định dạng:</label>
                        <select id="movieType" style="width: 100%;" required>
                            <option value="Phim lẻ">Phim lẻ</option>
                            <option value="Phim bộ">Phim bộ</option>
                            <option value="TV Show">TV Show</option>
                        </select>
                    </div>
                </div>

                <div class="mb-2">
                    <label class="text-muted">Link Video (Tập Full):</label>
                    <input type="text" id="movieVideoUrl" style="width: 100%;" placeholder="VD: https://youtube.com/..."
                        required>
                </div>

                <div class="mb-3">
                    <label class="text-muted">Poster Ảnh Bìa (Tùy chọn):</label>
                    <input type="file" id="moviePosterFile" accept="image/*" style="width: 100%;">
                    <small class="text-primary mt-1" id="uploadStatus"></small>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;" id="btnSubmitForm">Lưu Phim</button>
            </form>
        </div>
    </div>

    <script src="../services/api.js"></script>
    <script src="../modules/movie/admin.js"></script>
</body>

</html>
