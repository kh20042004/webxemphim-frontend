<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xem Phim - Chi Tiết</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/detail.css">
    <link rel="stylesheet" href="../styles/toast.css">
</head>
<body>
    <nav class="card flex-between" style="border-radius: 0; padding: 15px 20px;">
        <h2 class="text-primary" style="margin: 0;">🎥 XemPhim</h2>
        <a href="index.html" class="text-light">← Quay lại Trang chủ</a>
    </nav>

    <main class="container mt-4 mb-5 fade-in">
        <!-- VIDEO PLAYER -->
        <div class="video-player-wrapper shadow-lg">
            <video id="moviePlayer" controls style="display: none;">
                <source src="" type="video/mp4">
                Trình duyệt của bạn không hỗ trợ thẻ video.
            </video>
            <!-- YouTube/iframe player -->
            <iframe id="youtubePlayer" 
                    width="100%" height="100%" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen
                    style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
            </iframe>
        </div>

        <!-- THÔNG TIN PHIM -->
        <div class="card mt-3 slide-in-up">
            <div style="display: flex; justify-content: space-between; align-items: start; gap: 20px; margin-bottom: 20px;">
                <div style="flex: 1;">
                    <h1 id="movieTitle" style="margin-top: 0;">Đang tải thông tin phim...</h1>
                    <div class="flex gap-2 text-muted mb-2" id="movieMeta"></div>
                    <p id="movieDesc" class="text-light" style="line-height: 1.6;">...</p>
                </div>
                <button class="favorite-btn-detail" id="favoriteBtn" title="Thêm vào yêu thích" 
                        style="background: #e50914; border: none; padding: 10px 20px; color: white; border-radius: 50%; width: 50px; height: 50px; font-size: 24px; cursor: pointer; flex-shrink: 0;">
                    🤍
                </button>
            </div>
        </div>

        <!-- DANH SÁCH TẬP PHIM -->
        <div class="card mt-3 slide-in-up">
            <h3>📺 Danh sách tập phim</h3>
            <div id="episodesList" class="flex gap-1" style="flex-wrap: wrap; margin-top: 15px;">
                <p class="text-muted">Đang tải...</p>
            </div>
        </div>

        <!-- PHẦN BÌNH LUẬN & ĐÁNH GIÁ -->
        <div id="comment-section" class="card mt-3 slide-in-up">
            <!-- Nội dung sẽ được tạo bởi comments.js -->
        </div>
    </main>

    <!-- Load các JavaScript modules theo thứ tự -->
    <script src="../services/api.js"></script>
    <script src="../services/toast.js"></script>
    <script src="../modules/movie/comments.js"></script>
    <script src="../modules/movie/detail.js"></script>
</body>
</html>
